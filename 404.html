<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex" name="robots"/>
<title>Page not found | Johnson Mugarra</title>
<meta content="#000000" media="(prefers-color-scheme: dark)" name="theme-color"/>
<meta content="#FFFFFF" media="(prefers-color-scheme: light)" name="theme-color"/>
<link href="img/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
<style>
  /* Deliberately standalone: this page has to render even when the
     stylesheet is the thing that failed. Same palette as the site,
     following the OS theme. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #1d1d1f;
    --dim: #57575c;
    --accent: #0064ce;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --ink: #f5f5f7;
      --dim: #98989d;
      --accent: #2997ff;
      /* The bright accent is light, so its label goes dark. White on
         #2997FF measures 2.9:1 and would fail. */
      --on-accent: #000000;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
    line-height: 1.68;
  }
  main { text-align: center; padding: 2rem; max-width: 34rem; }
  .code {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: 2rem; margin: 0.75rem 0 0.5rem; letter-spacing: -0.02em; text-wrap: balance; }
  .lede { color: var(--dim); margin: 0 0 1.75rem; }
  .btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 980px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .btn:hover { opacity: 0.9; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<p class="code">404 &middot; off the map</p>
<h1>This page doesn't exist</h1>
<p class="lede">The record you're looking for isn't here. The rest of the field log is.</p>
<a class="btn" href="/">Back to the portfolio</a>
</main>
</body>
</html>
