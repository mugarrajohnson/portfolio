<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex" name="robots"/>
<title>Page not found — Johnson Mugarra</title>
<meta content="#0C0B0A" media="(prefers-color-scheme: dark)" name="theme-color"/>
<meta content="#F1ECE1" media="(prefers-color-scheme: light)" name="theme-color"/>
<link href="img/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
<style>
  /* Deliberately standalone: this page has to render even when the
     stylesheet is the thing that failed. Same palette as the site,
     following the OS theme. */
  :root {
    color-scheme: dark;
    --bg: #0c0b0a;
    --ink: #ede6d8;
    --dim: rgb(143 136 126);
    --accent: #e8a020;
    --on-accent: #1a1206;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f1ece1;
      --ink: #1a1712;
      --dim: rgb(110 100 85);
      --accent: #8a5a14;
      --on-accent: #fbf8f1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.68;
  }
  main { text-align: center; padding: 2rem; max-width: 34rem; }
  .code {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: 2rem; margin: 0.75rem 0 0.5rem; letter-spacing: -0.02em; text-wrap: balance; }
  .lede { color: var(--dim); margin: 0 0 1.75rem; }
  .btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 3px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .btn:hover { opacity: 0.9; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<p class="code">404 — off the map</p>
<h1>This page doesn't exist</h1>
<p class="lede">The record you're looking for isn't here. The rest of the field log is.</p>
<a class="btn" href="/">Back to the portfolio</a>
</main>
</body>
</html>
