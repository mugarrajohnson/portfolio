server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location = /nginx.conf { return 404; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Immutable-ish media: safe to cache long
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2?|pdf)$ {
        expires 30d;
        access_log off;
    }

    # Code: shorter cache, sw.js always revalidated
    location = /sw.js { expires -1; }
    location ~* \.(?:css|js)$ { expires 7d; }
}
