server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Nothing outside the site itself should be reachable.
    location = /nginx.conf { return 404; }
    location = /package.json { return 404; }
    location = /package-lock.json { return 404; }
    location = /tailwind.config.js { return 404; }
    location ^~ /src/ { return 404; }
    location ^~ /scripts/ { return 404; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Enable once you have confirmed the GTM container loads only the tags
    # allowed here. Both the theme bootstrap and the GTM snippet are inline,
    # which is why script-src needs 'unsafe-inline'.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://d3js.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ghchart.rshah.org https://www.googletagmanager.com; connect-src 'self' https://api.emailjs.com https://formspree.io https://www.google-analytics.com; frame-src https://www.googletagmanager.com; base-uri 'self'; form-action 'self'" always;

    # Media and fonts are replaced rather than edited, so cache them hard.
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Code carries no content hash in its filename, so it has to revalidate
    # instead of sitting in a browser cache across a deploy.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # A stale service worker sticks around and keeps serving stale everything.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
